  version: 0.1.6
  published: '2021-07-19'
  description: >-
    Converts struct fields to a flat vector representation and back, with a `parameters(x)` hook
    that dynamically decides which fields are free and which are fixed. This is the shape an
    inverse-design / gradient-optimization loop needs, and it is used with Zygote in the README —
    consistent with metasurface inverse design, which is Metalenz's core numerical problem.
  note: >-
    Registered in the Julia General registry (F/FlexibleFunctors/Package.toml points at
    github.com/Metalenz/FlexibleFunctors.jl); three versions registered, 0.1.4 through 0.1.6.
    Latest tag v0.1.6 dates to 2021-07-19 — five years stale at capture, and the repository has
    had no push since. Treat as unmaintained.
