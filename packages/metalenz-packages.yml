description: >-
  Metalenz publishes no API client library, in any language, for any of its surfaces — there is no
  developer program to build one against. It does publish three public repositories in its own
  GitHub organization, github.com/Metalenz, and one of them is a registered Julia package. These
  are internal scientific-computing tools from the metasurface inverse-design team, not SDKs.
  Ownership is not inferred: both registered packages carry Metalenz corporate email addresses in
  their Project.toml `authors` field (sam@metalenz.com, pawel@metalenz.com — Sam Buercklin,
  research software engineer, and Pawel Latawiec, CTO). No `SDKs` pointer is emitted in apis.yml,
  because none of these wraps an API and emitting one would credit Metalenz with a client library
  it does not ship.
sdk_count: 0
