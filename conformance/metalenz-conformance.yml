compliance_note: >-
  No SOC 2, ISO 27001, PCI, HIPAA or FedRAMP claim appears anywhere on metalenz.com, and there is
  no trust center. No Compliance pointer is emitted in apis.yml, because a pointer would assert a
  published compliance program that does not exist. The site publishes Terms and Conditions of Sale
  for hardware but does not publish a privacy policy — /privacy-policy/ returns 404 and no privacy
  link appears in the footer of any page checked — so no PrivacyPolicy pointer is emitted either.
