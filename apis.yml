aid: metalenz
name: Metalenz
description: >-
  Metalenz is a fabless semiconductor optics company in Boston, Massachusetts that commercialises
  meta-optics — flat metasurface lenses that replace stacks of curved refractive elements with a
  single planar chip patterned by nanostructures and mass produced in a standard semiconductor
  foundry. The company was founded in 2016 by CEO Rob Devlin and Harvard professor Federico Capasso
  out of the Capasso Lab at the Harvard John A. Paulson School of Engineering and Applied Sciences,
  and holds the exclusive worldwide licence to that lab's metasurface intellectual property, now
  more than 150 issued and pending patents. Its first-generation metasurfaces reached mass
  production in 2022 through a manufacturing partnership with STMicroelectronics and have since
  shipped in well over 100 million consumer devices. The current product line is built on the
  PolarEyes polarization imaging platform: Polar ID, a single-camera polarization face
  authentication system for smartphones that works under the display and uses the Samsung ISOCELL
  Vizion 931 sensor and Qualcomm Snapdragon imaging stack; Polar 3D, on-device relightable selfies
  and avatars from one image; and the Orion and Gemini dot-pattern projectors for structured-light
  3D sensing. Metalenz sells optical components, licences and full-stack biometric solutions to
  device makers and foundries — UMC and STMicroelectronics are named manufacturing partners — and
  is backed by Neotribe Ventures, Intel Capital, TDK Ventures, 3M, Applied Ventures, M Ventures,
  Braemar Energy Ventures and Foothill Ventures. It sells silicon and IP, not software: it
  publishes no developer program, no developer portal, no SDK and no API documentation of any kind.
  The only machine-readable interface it exposes to the public is the WordPress REST content API
  behind metalenz.com, which is anonymously readable, read-only without credentials, and captured
  here for discovery purposes.
