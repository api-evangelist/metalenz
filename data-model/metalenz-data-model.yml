pii:
  present: true
  entities: [User, Comment]
  detail: >-
    GET /wp/v2/users returns three real WordPress accounts with display name, slug, description,
    avatar URLs and author-archive link. Email address, registration date, roles and capabilities
    are `edit`-context and are withheld from anonymous callers, so no contact detail is exposed —
    but the display names are personal data. This artifact documents the SHAPE of that endpoint and
    deliberately names no individual, no example response containing a real person is stored
    anywhere in this repository, and no agent skill or MCP tool is emitted for the users route.
    See skills/_index.yml for the recorded exclusion.
