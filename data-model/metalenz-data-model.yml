  The entity-relationship graph of the metalenz.com WordPress REST content API, derived from the
  JSON Schema documents the server publishes via HTTP OPTIONS and from the `_links` relations
  present on live records. Identifiers are plain integers — this surface has no prefixed or typed
  ids.
identifiers:
  scheme: integer
  detail: >-
    Every object is keyed by a site-local auto-increment integer. Posts, pages and attachments
    share one id space (they are all WordPress posts); terms have their own. There is no
    id-prefix convention, no UUID and no cross-site stable identifier. The only globally unique
    handle is `guid.rendered`, which is a URL and is explicitly not resolvable as an API address.
